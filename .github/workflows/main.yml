name: Docker Build and Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t smart-team-task-manager .

      - name: Run Docker Container
        run: docker run -d -p 3000:3000 --name task-manager smart-team-task-manager

      - name: Test API
        run: |
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/api/tasks
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/api/users

      - name: Stop Container
        if: always()
        run: docker stop task-manager || true
